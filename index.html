<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saludo de fin de año Ingepro</title>
<meta property="og:title" content="Felices fiestas · Ingepro">
<meta property="og:image" content="portada.jpg">
<style>
:root { --fondo: #03283f; --verde: #4DB69C; --hueso: #E9E5D6; color-scheme: dark; }
html, body { margin: 0; height: 100%; background: var(--fondo); overflow: hidden; }
.escena { position: fixed; inset: 0; display: grid; place-items: center; }
video { width: 100vw; height: 100vh; height: 100dvh; object-fit: contain; background: var(--fondo); display: block; }
#sonido {
  position: absolute; top: max(20px, env(safe-area-inset-top)); left: 50%;
  transform: translateX(-50%);
  display: flex; align-items: center; gap: 8px;
  padding: 10px 18px; border-radius: 999px;
  border: 1.5px solid var(--hueso); background: rgba(3, 40, 63, 0.8);
  font: 600 14px/1 "Helvetica Neue", Arial, sans-serif; color: var(--hueso); cursor: pointer;
}
#sonido[hidden] { display: none; }
#sonido:focus-visible { outline: 3px solid var(--verde); outline-offset: 4px; }
#sonido svg { width: 18px; height: 18px; fill: var(--hueso); }
</style>
</head>
<body>
<div class="escena">
  <video id="v" src="saludo.mp4" poster="portada.jpg" playsinline preload="auto" controls></video>
  <button id="sonido" type="button" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
    Activar sonido
  </button>
</div>
<script>
const v = document.getElementById('v');
const sonido = document.getElementById('sonido');

async function arrancar() {
  try {
    v.muted = false;
    await v.play();
  } catch (e) {
    try {
      v.muted = true;
      await v.play();
      sonido.hidden = false;
    } catch (e2) { /* queda con los controles para darle play */ }
  }
}

sonido.addEventListener('click', () => {
  v.muted = false; v.currentTime = 0; v.play();
  sonido.hidden = true;
});
v.addEventListener('volumechange', () => { if (!v.muted) sonido.hidden = true; });
v.addEventListener('ended', () => { sonido.hidden = true; });
arrancar();
</script>
</body>
</html>
