<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saludo de fin de año Ingepro</title>
<meta property="og:title" content="Felices fiestas · Ingepro">
<meta property="og:image" content="portada.jpg">
<style>
:root { --fondo: #002440; --verde: #4DB69C; --hueso: #E9E5D6; color-scheme: dark; }
html, body { margin: 0; height: 100%; background: var(--fondo); overflow: hidden; }
.escena { position: fixed; inset: 0; display: grid; place-items: center; }
video { width: 100vw; height: 100vh; height: 100dvh; object-fit: cover; background: var(--fondo); display: block; }
#sonido {
  position: absolute; top: max(16px, env(safe-area-inset-top)); right: 16px;
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; padding: 0;
  border: 1.5px solid rgba(233, 229, 214, 0.7); background: rgba(3, 40, 63, 0.7);
  cursor: pointer;
}
#sonido[hidden], #capa[hidden] { display: none; }
#capa { position: absolute; inset: 0; cursor: pointer; }
#sonido:focus-visible { outline: 3px solid var(--verde); outline-offset: 4px; }
#sonido svg { width: 22px; height: 22px; fill: var(--hueso); }
</style>
</head>
<body>
<div class="escena">
  <video id="v" src="saludo.mp4" poster="portada.jpg" playsinline preload="auto"></video>
  <div id="capa" hidden></div>
  <button id="sonido" type="button" aria-label="Activar sonido" title="Activar sonido" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16.3 8.9l1.4-1.4L20 9.8l2.3-2.3 1.4 1.4-2.3 2.3 2.3 2.3-1.4 1.4-2.3-2.3-2.3 2.3-1.4-1.4 2.3-2.3z"/></svg>
  </button>
</div>
<script>
const v = document.getElementById('v');
if (window.innerWidth > window.innerHeight) { v.poster = 'portada-ancho3.jpg'; v.src = 'saludo-ancho3.mp4'; }
else { v.poster = 'portada-alto3.jpg'; v.src = 'saludo-alto3.mp4'; }
const sonido = document.getElementById('sonido');
const capa = document.getElementById('capa');

function pantallaCompleta() {
  const el = document.documentElement;
  try {
    if (el.requestFullscreen) { el.requestFullscreen().catch(() => {}); }
    else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
    else if (v.webkitEnterFullscreen) { v.webkitEnterFullscreen(); }
  } catch (e) {}
}

function salirPantallaCompleta() {
  try {
    if (document.fullscreenElement && document.exitFullscreen) { document.exitFullscreen().catch(() => {}); }
    else if (document.webkitFullscreenElement && document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
    else if (v.webkitDisplayingFullscreen && v.webkitExitFullscreen) { v.webkitExitFullscreen(); }
  } catch (e) {}
}

function primerToque(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  sonido.hidden = true;
  pantallaCompleta();
  v.muted = false; v.currentTime = 0;
  v.play().catch(() => {});
}

async function arrancar() {
  v.muted = true;
  try { await v.play(); } catch (e) {}
  capa.hidden = false;
  sonido.hidden = false;
}

let iniciado = false;
capa.addEventListener('click', (e) => {
  if (!iniciado) { iniciado = true; primerToque(e); return; }
  if (v.paused) { if (v.ended) v.currentTime = 0; v.play().catch(() => {}); } else { v.pause(); }
});
sonido.addEventListener('click', (e) => { iniciado = true; primerToque(e); });
v.addEventListener('ended', () => { iniciado = false; salirPantallaCompleta(); v.load(); sonido.hidden = false; });
arrancar();
</script>
</body>
</html>
