<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saludo de fin de año Ingepro</title>
<meta property="og:title" content="Felices fiestas · Ingepro">
<meta property="og:image" content="portada.jpg">
<style>
:root { --fondo: #03283f; --verde: #4DB69C; --hueso: #E9E5D6; color-scheme: dark; }
html, body { margin: 0; height: 100%; background: var(--fondo); overflow: hidden; }
.escena { position: fixed; inset: 0; display: grid; place-items: center; }
video { width: 100vw; height: 100vh; height: 100dvh; object-fit: contain; background: var(--fondo); display: block; }
#play {
  position: absolute; inset: 0; margin: auto;
  width: 88px; height: 88px; border-radius: 50%;
  border: 2px solid var(--hueso); background: rgba(3, 40, 63, 0.55);
  cursor: pointer; display: grid; place-items: center;
}
#play:focus-visible { outline: 3px solid var(--verde); outline-offset: 4px; }
#play svg { width: 34px; height: 34px; margin-left: 6px; fill: var(--hueso); }
#play[hidden] { display: none; }
</style>
</head>
<body>
<div class="escena">
  <video id="v" src="saludo.mp4" poster="portada.jpg" playsinline preload="auto"></video>
  <button id="play" type="button" aria-label="Reproducir saludo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l16 9-16 9z"/></svg>
  </button>
</div>
<script>
const v = document.getElementById('v');
const b = document.getElementById('play');
function reproducir() { b.hidden = true; v.controls = true; v.play(); }
b.addEventListener('click', reproducir);
v.addEventListener('click', () => { if (!b.hidden) reproducir(); });
v.addEventListener('ended', () => { v.controls = false; b.hidden = false; v.currentTime = 0; });
</script>
</body>
</html>
